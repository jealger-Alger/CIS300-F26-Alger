<!DOCTYPE html>
<html>
    <head>
        <title>Project Test</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="project.css">
    </head>
    <body>
        <main>
            <h1>Project Color Palette</h1>
            <p>
                These samples use the color variables defined in <code>project.css</code>.
            </p>

            <section aria-labelledby="palette-heading">
                <h2 id="palette-heading">Theme colors</h2>
                <div class="palette">
                    <article class="color-swatch primary">
                        <h3>Primary</h3>
                        <p>--primary</p>
                    </article>
                    <article class="color-swatch secondary">
                        <h3>Secondary</h3>
                        <p>--secondary</p>
                    </article>
                    <article class="color-swatch accent">
                        <h3>Accent</h3>
                        <p>--accent</p>
                    </article>
                    <article class="color-swatch background">
                        <h3>Background</h3>
                        <p>--background</p>
                    </article>
                </div>
            </section>
        </main>
    </body>
</html>
